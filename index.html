<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0f" />
    <script>
      // Applies the saved theme before first paint (no flash of another theme).
      // Kept in sync with src/theme/themes.ts; the colors themselves live in
      // src/theme/theme.css only.
      (function () {
        try {
          var stored = localStorage.getItem('muscu-tracker:theme-v2');
          var known = ['iron-night', 'khmer-light', 'khmer-dark'];
          document.documentElement.setAttribute('data-theme', known.indexOf(stored) >= 0 ? stored : 'iron-night');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'iron-night');
        }
      })();
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Muscu" />
    <meta name="description" content="Suivi de musculation hors-ligne, rapide et sans compte." />
    <title>Muscu Tracker</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
